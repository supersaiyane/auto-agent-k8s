apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: auto-agent
  namespace: auto-agent
  labels:
    app: auto-agent
spec:
  selector:
    matchLabels:
      app: auto-agent
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: auto-agent
    spec:
      serviceAccountName: auto-agent
      priorityClassName: system-node-critical
      terminationGracePeriodSeconds: 30
      tolerations:
        - operator: "Exists"
      volumes:
        - name: logs
          hostPath:
            path: /var/log/auto-agent
            type: DirectoryOrCreate
      containers:
        - name: agent
          image: auto-agent:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: auto-agent-config
            - secretRef:
                name: auto-agent-secrets
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: logs
              mountPath: /var/log/auto-agent
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: auto-agent
  namespace: auto-agent
spec:
  selector:
    app: auto-agent
  ports:
    - name: http
      port: 8080
      targetPort: 8080
