apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: auto-agent
  namespace: auto-agent
  labels:
    app: auto-agent
spec:
  selector:
    matchLabels:
      app: auto-agent
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: auto-agent
    spec:
      serviceAccountName: auto-agent
      priorityClassName: system-node-critical
      terminationGracePeriodSeconds: 30
      # Same hardening as charts/auto-agent/templates/daemonset.yaml (ISS-010).
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      tolerations:
        - operator: "Exists"
      volumes:
        - name: logs
          hostPath:
            path: /var/log/auto-agent
            type: DirectoryOrCreate
      initContainers:
        # Hands the root-owned hostPath log directory to the agent's uid.
        - name: log-dir-owner
          image: busybox:1.36@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
          command: ["chown", "65532:65532", "/var/log/auto-agent"]
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"], add: ["CHOWN"] }
          volumeMounts:
            - name: logs
              mountPath: /var/log/auto-agent
      containers:
        - name: agent
          image: auto-agent:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: auto-agent-config
            - secretRef:
                name: auto-agent-secrets
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: logs
              mountPath: /var/log/auto-agent
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
---
apiVersion: v1
kind: Service
metadata:
  name: auto-agent
  namespace: auto-agent
spec:
  type: NodePort
  selector:
    app: auto-agent
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30080
