##############################################################
# APP 3: inventory-service (namespace: test2)
# 3 pods — each fails in a different way
#
# Pod 1 (pending):    Pending — impossible resource request
# Pod 2 (restart):    Restart storm — exits rapidly
# Pod 3 (rollout):    Stuck rollout — broken v2 after healthy v1
##############################################################

# Deployment 1: Pending — requests more resources than the cluster has
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-db
  namespace: test2
  labels:
    app: inventory-db
    team: inventory
    tier: database
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventory-db
  template:
    metadata:
      labels:
        app: inventory-db
        team: inventory
    spec:
      containers:
        - name: postgres
          image: busybox:1.36
          command: ["sleep", "infinity"]
          resources:
            requests:
              cpu: "500"
              memory: "999Gi"
            limits:
              cpu: "500"
              memory: "999Gi"
---
# Deployment 2: Restart storm — process exits after 1 second, restarts rapidly
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-sync
  namespace: test2
  labels:
    app: inventory-sync
    team: inventory
    tier: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventory-sync
  template:
    metadata:
      labels:
        app: inventory-sync
        team: inventory
    spec:
      containers:
        - name: sync
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "[inventory-sync] Syncing from warehouse API..."
              echo "[inventory-sync] ERROR: API returned 503 Service Unavailable"
              sleep 1
              exit 0
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
---
# Deployment 3: Healthy first, then we deploy a broken version
# This creates a stuck rollout (ProgressDeadlineExceeded)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-api
  namespace: test2
  labels:
    app: inventory-api
    team: inventory
    tier: backend
spec:
  replicas: 2
  progressDeadlineSeconds: 60
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: inventory-api
  template:
    metadata:
      labels:
        app: inventory-api
        team: inventory
    spec:
      containers:
        - name: api
          image: busybox:1.36
          command: ["sh", "-c", "echo '[inventory-api] v1 healthy'; sleep infinity"]
          readinessProbe:
            exec:
              command: ["true"]
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
---
# Resource quota — tight, will alert at 90% usage
apiVersion: v1
kind: ResourceQuota
metadata:
  name: inventory-quota
  namespace: test2
spec:
  hard:
    pods: "10"
    requests.cpu: "1"
    requests.memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-api
  namespace: test2
spec:
  selector:
    app: inventory-api
  ports:
    - port: 80
      targetPort: 8080
