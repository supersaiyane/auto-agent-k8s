# ============================================================
# RESOURCE ISSUES (2 issues)
# ============================================================

# 22. Tight ResourceQuota
apiVersion: v1
kind: ResourceQuota
metadata: { name: tight-quota, namespace: chaos, labels: { suite: resource } }
spec:
  hard:
    pods: "25"
    requests.cpu: "1"
    requests.memory: "512Mi"
