apiVersion: v1
kind: ConfigMap
metadata:
  name: auto-agent-config
  namespace: auto-agent
data:
  # Mode: observe | suggest | fix | dry-run
  AUTO_MODE: "fix"

  # Namespaces to watch
  NAMESPACE_ALLOWLIST: "default,test1,test2"

  # Scaling
  HPA_COEXISTENCE: "true"
  SCALE_CPU_THRESHOLD: "0.8"
  SCALE_WINDOW: "5m"
  MAX_SCALE_STEP: "2"
  MAX_REPLICAS: "50"
  MIN_REPLICAS: "1"
  COOLDOWN_UP: "2m"
  COOLDOWN_DOWN: "10m"

  # Safety
  MAX_ACTIONS_PER_10M: "10"
  DEDUP_TTL_SECONDS: "300"
  EXCLUDED_ANNOTATION: "auto-agent.io/disable"
  QUIET_HOURS: ""

  # Prometheus (installed in monitoring namespace)
  METRICS_PROVIDER: "prometheus"
  PROMETHEUS_URL: "http://prometheus-kube-prometheus-prometheus.monitoring:9090"

  # Alertmanager (installed with Prometheus)
  ALERTMANAGER_URL: "http://prometheus-kube-prometheus-alertmanager.monitoring:9093"

  # Ticketing (Jira)
  TICKETS_ENABLED: "true"
  TICKETS_PROVIDER: "jira"
  JIRA_BASE_URL: ""
  JIRA_PROJECT_KEY: ""

  # Cost (OpenCost installed in opencost namespace)
  COST_PROVIDER: "opencost"
  OPENCOST_URL: "http://opencost.opencost:9003"

  # Learning mode
  LEARNING_ENABLED: "true"

  # LLM diagnosis
  LLM_ENABLED: "false"
  LLM_API_URL: ""
  LLM_MODEL: ""
  LLM_TIMEOUT_SEC: "10"

  # Logging
  LOG_LEVEL: "info"
  LOG_STORE: "efs"
  LOG_EFS_PATH: "/var/log/auto-agent"
  LOG_S3_BUCKET: ""
  LOG_S3_PREFIX: ""
  LOG_FORMAT: ""
  SLACK_TIMEOUT_SEC: "5"
  AUDIT_LOG_PATH: "/var/log/auto-agent/audit.jsonl"
---
apiVersion: v1
kind: Secret
metadata:
  name: auto-agent-secrets
  namespace: auto-agent
type: Opaque
stringData:
  # Set credentials via kubectl patch — DO NOT commit real values here
  # kubectl patch secret auto-agent-secrets -n auto-agent --type merge \
  #   -p '{"stringData":{"SLACK_WEBHOOK_URL":"https://hooks.slack.com/..."}}'
  SLACK_WEBHOOK_URL: ""
  LLM_API_KEY: ""
  GIT_TOKEN: ""
  GITHUB_TOKEN: ""
  JIRA_TOKEN: ""
  JIRA_EMAIL: ""
  PAGERDUTY_ROUTING_KEY: ""
  OPSGENIE_API_KEY: ""
