<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>auto-agent dashboard</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="app.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header class="header">
    <h1><span>auto-agent</span> dashboard</h1>
    <div class="status-bar" aria-live="polite">
      <span id="version"></span>
      <span id="mode-badge" class="badge"></span>
      <span id="leader-badge" class="badge"></span>
      <span id="anywhere-badge" class="badge badge-danger" title="rbac.fixAnywhere: write permissions in every namespace" hidden>fix anywhere</span>
      <span id="node-name" class="muted mono"></span>
      <label class="muted" for="view-ns">Namespace</label>
      <select id="view-ns" title="Filters every tab; never changes what the agent does"><option value="">All namespaces</option></select>
      <label class="muted" for="refresh-rate">Refresh</label>
      <select id="refresh-rate">
        <option value="5000">5s</option>
        <option value="15000">15s</option>
        <option value="60000">60s</option>
        <option value="0">paused</option>
      </select>
      <button type="button" class="btn" data-action="refresh-now">Refresh now</button>
      <button type="button" class="btn" data-action="sign-out">Sign out</button>
    </div>
  </header>

  <div id="login" class="login" hidden>
    <form id="login-form" class="login-box">
      <h2>Dashboard token</h2>
      <p class="muted">The <code>DASHBOARD_TOKEN</code> from the agent's Secret. It stays in this tab only.</p>
      <label for="token-input" class="sr-only">Token</label>
      <input id="token-input" type="password" autocomplete="off" required>
      <button type="submit" class="btn primary">Sign in</button>
      <p id="login-error" class="error" role="alert"></p>
    </form>
  </div>

  <section class="stat-row" aria-label="Event totals">
    <button type="button" class="stat-box active" data-action="filter-type" data-arg="">
      <span class="label">Total events</span><span class="val accent" id="stat-total">-</span></button>
    <button type="button" class="stat-box" data-action="filter-type" data-arg="incident">
      <span class="label">Incidents</span><span class="val red" id="stat-incident">-</span></button>
    <button type="button" class="stat-box" data-action="filter-type" data-arg="action">
      <span class="label">Actions</span><span class="val green" id="stat-action">-</span></button>
    <button type="button" class="stat-box" data-action="filter-type" data-arg="audit">
      <span class="label">Gate decisions</span><span class="val purple" id="stat-audit">-</span></button>
    <div class="stat-box static">
      <span class="label">Uptime</span><span class="uptime" id="stat-uptime">00:00:00</span></div>
  </section>

  <main class="main">
    <nav class="tabs" role="tablist" aria-label="Views">
      <button type="button" role="tab" data-tab="events">Events</button>
      <button type="button" role="tab" data-tab="audit">Audit</button>
      <button type="button" role="tab" data-tab="dryrun">Dry run</button>
      <button type="button" role="tab" data-tab="actions">Fixes</button>
      <button type="button" role="tab" data-tab="reloads">Reloads</button>
      <button type="button" role="tab" data-tab="compliance">Compliance</button>
      <button type="button" role="tab" data-tab="deploys">Deploys</button>
      <button type="button" role="tab" data-tab="baselines">Baselines</button>
      <button type="button" role="tab" data-tab="k8sevents">K8s events</button>
      <button type="button" role="tab" data-tab="charts">Charts</button>
      <button type="button" role="tab" data-tab="report">Report</button>
      <button type="button" role="tab" data-tab="cluster">Cluster</button>
      <button type="button" role="tab" data-tab="nodes">Nodes</button>
      <button type="button" role="tab" data-tab="cost">Cost</button>
      <button type="button" role="tab" data-tab="resources">Resources</button>
      <button type="button" role="tab" data-tab="terminal">Terminal</button>
      <button type="button" role="tab" data-tab="settings">Settings</button>
    </nav>

    <div class="toolbar" id="toolbar" role="search">
      <label for="f-sev">Severity</label>
      <select id="f-sev">
        <option value="">all</option><option value="critical">critical</option>
        <option value="warning">warning</option><option value="info">info</option>
      </select>
      <label for="f-result">Result</label>
      <select id="f-result">
        <option value="">all</option><option value="success">applied</option><option value="simulated">simulated</option>
        <option value="suggested">suggested</option><option value="blocked">blocked</option><option value="failed">failed</option>
      </select>
      <label for="f-search">Search</label>
      <input id="f-search" type="search" placeholder="reason, workload, message">
      <span id="f-count" class="muted"></span>
    </div>

    <section id="view" role="tabpanel" tabindex="0" aria-live="polite"><div class="empty">Loading...</div></section>

    <section id="terminal" class="terminal" role="tabpanel" hidden>
      <div id="term-output" class="term-output"></div>
      <div class="term-line">
        <span class="term-prompt">$ kubectl</span>
        <label for="term-input" class="sr-only">kubectl command</label>
        <input id="term-input" type="text" placeholder="get pods -n default" autocomplete="off" spellcheck="false">
      </div>
      <p class="muted small">Supports get, describe, logs and version, in watched namespaces only. Type help.</p>
    </section>
  </main>
</body>
</html>
