##############################################################
# TEST: Restart Storm Detection
# EXPECTED: Agent detects >5 rapid restarts before
#           CrashLoopBackOff, warns about impending crash loop
##############################################################
apiVersion: apps/v1
kind: Deployment
metadata:
  name: restart-storm-test
  namespace: test-apps
  labels:
    app: restart-storm-test
    test-scenario: restart-storm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: restart-storm-test
  template:
    metadata:
      labels:
        app: restart-storm-test
    spec:
      containers:
        - name: flaky
          image: busybox:1.36
          # Exits after 1 second — will restart rapidly
          command: ["sh", "-c", "echo 'flaky process started'; sleep 1; exit 0"]
          resources:
            limits:
              memory: "32Mi"
              cpu: "50m"
