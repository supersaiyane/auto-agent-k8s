##############################################################
# TEST: CreateContainerConfigError
# EXPECTED: Agent detects missing ConfigMap reference,
#           alerts with specific ConfigMap name
##############################################################
apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-error-test
  namespace: test-apps
  labels:
    app: config-error-test
    test-scenario: config-error
spec:
  replicas: 1
  selector:
    matchLabels:
      app: config-error-test
  template:
    metadata:
      labels:
        app: config-error-test
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sleep", "infinity"]
          envFrom:
            - configMapRef:
                name: nonexistent-config-that-doesnt-exist
          resources:
            limits:
              memory: "64Mi"
              cpu: "50m"
