##############################################################
# TEST: OOMKilled Detection
# EXPECTED: Agent detects OOM, collects logs, opens GitOps PR
#           (if configured), sends alert with memory limit info
##############################################################
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oom-test
  namespace: test-apps
  labels:
    app: oom-test
    test-scenario: oom
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oom-test
  template:
    metadata:
      labels:
        app: oom-test
    spec:
      containers:
        - name: memory-hog
          image: polinux/stress:latest
          command: ["stress"]
          args: ["--vm", "1", "--vm-bytes", "256M", "--vm-hang", "0"]
          resources:
            limits:
              memory: "64Mi"
              cpu: "100m"
            requests:
              memory: "32Mi"
              cpu: "50m"
