##############################################################
# TEST: ImagePullBackOff Detection
# EXPECTED: Agent detects failed image pull, collects events,
#           suggests checking image name and registry creds
##############################################################
apiVersion: apps/v1
kind: Deployment
metadata:
  name: imagepull-test
  namespace: test-apps
  labels:
    app: imagepull-test
    test-scenario: imagepull
spec:
  replicas: 1
  selector:
    matchLabels:
      app: imagepull-test
  template:
    metadata:
      labels:
        app: imagepull-test
    spec:
      containers:
        - name: bad-image
          image: registry.invalid/nonexistent/image:v99.99.99
          resources:
            limits:
              memory: "64Mi"
              cpu: "50m"
