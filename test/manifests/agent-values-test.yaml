# Helm values override for local testing
image:
  repository: auto-agent
  tag: "test"
  pullPolicy: IfNotPresent

namespace: kube-system
priorityClassName: system-node-critical

agent:
  mode: fix
  hpaCoexistence: true
  cpuThreshold: 0.8
  scaleWindow: 5m
  maxScaleStep: 2
  maxActionsPer10m: 50          # generous for testing
  namespaceAllowlist: ["test-apps", "test-apps-2"]
  excludedAnnotation: "auto-agent.io/disable"
  logLevel: info
  cooldownUp: 30s               # short for testing
  cooldownDown: 1m
  maxReplicas: 20
  minReplicas: 1
  dedupTtlSeconds: 60           # short for testing (1 min)
  llmTimeoutSec: 10
  slackTimeoutSec: 5

llm:
  apiUrl: ""
  model: ""
  enabled: false                # disable LLM for local testing

slack:
  webhookUrl: ""                # leave empty for local testing (logs only)

metricsProvider:
  type: "metrics-server"        # use metrics-server in KIND
  prometheusUrl: ""

gitops:
  mode: pr
  provider: github
  repo: ""
  branch: "main"
  valuesFile: ""
  author:
    name: "auto-agent-bot"
    email: "test@test.local"

tickets:
  enabled: false
  provider: github
  github:
    repo: ""
  jira:
    baseUrl: ""
    projectKey: ""

anomalies:
  pollInterval: 30s

logs:
  store: efs
  s3:
    bucket: ""
    prefix: ""
  efs:
    path: /var/log/auto-agent
  retentionDays: 1

images:
  mirror:
    enabled: false
    prefix: ""
    allowList: []

env:
  - name: QUIET_HOURS
    value: ""
  - name: AUDIT_LOG_PATH
    value: "/var/log/auto-agent/audit.jsonl"
  - name: ALERTMANAGER_URL
    value: ""

tolerations:
  - operator: "Exists"
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 300m
    memory: 384Mi
