##############################################################
# TEST: Pending Pod Detection
# EXPECTED: After 5min, agent detects pod stuck in Pending,
#           diagnoses reason (Insufficient resources), alerts
##############################################################
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pending-test
  namespace: test-apps
  labels:
    app: pending-test
    test-scenario: pending
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pending-test
  template:
    metadata:
      labels:
        app: pending-test
    spec:
      containers:
        - name: greedy
          image: busybox:1.36
          command: ["sleep", "infinity"]
          resources:
            requests:
              memory: "999Gi"
              cpu: "999"
            limits:
              memory: "999Gi"
              cpu: "999"
