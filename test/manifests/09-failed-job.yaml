##############################################################
# TEST: Failed Job Detection
# EXPECTED: Agent detects failed Job, collects pod logs,
#           creates ticket, cleans up old failed jobs
##############################################################
apiVersion: batch/v1
kind: Job
metadata:
  name: failing-job
  namespace: test-apps
  labels:
    test-scenario: failed-job
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: worker
          image: busybox:1.36
          command: ["sh", "-c", "echo 'Processing batch...'; sleep 3; echo 'FATAL: invalid data format'; exit 1"]
          resources:
            limits:
              memory: "64Mi"
              cpu: "50m"
---
# CronJob that always fails (for cleanup test)
apiVersion: batch/v1
kind: CronJob
metadata:
  name: failing-cronjob
  namespace: test-apps
  labels:
    test-scenario: failed-cronjob
spec:
  schedule: "*/2 * * * *"
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: cron-worker
              image: busybox:1.36
              command: ["sh", "-c", "echo 'Cron task failed'; exit 1"]
              resources:
                limits:
                  memory: "32Mi"
                  cpu: "50m"
