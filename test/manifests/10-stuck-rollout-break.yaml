##############################################################
# Apply this AFTER 10-stuck-rollout.yaml is healthy
# This triggers the broken rollout
##############################################################
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rollout-test
  namespace: test-apps
spec:
  template:
    spec:
      containers:
        - name: app
          image: registry.invalid/broken:v2
          command: ["sleep", "infinity"]
          readinessProbe:
            exec:
              command: ["true"]
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            limits:
              memory: "64Mi"
              cpu: "50m"
