##############################################################
# TEST: Excluded Pod (Annotation Escape Hatch)
# EXPECTED: Agent completely ignores this pod despite it
#           being in CrashLoopBackOff — no alerts, no actions
##############################################################
apiVersion: apps/v1
kind: Deployment
metadata:
  name: excluded-test
  namespace: test-apps
  labels:
    app: excluded-test
    test-scenario: excluded
spec:
  replicas: 1
  selector:
    matchLabels:
      app: excluded-test
  template:
    metadata:
      labels:
        app: excluded-test
      annotations:
        auto-agent.io/disable: "true"
    spec:
      containers:
        - name: ignored
          image: busybox:1.36
          command: ["sh", "-c", "exit 1"]
          resources:
            limits:
              memory: "32Mi"
              cpu: "50m"
