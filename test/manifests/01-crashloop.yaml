##############################################################
# TEST: CrashLoopBackOff Detection
# EXPECTED: Agent detects crash, collects logs, deletes pod
#           (in fix mode), sends Slack alert, creates ticket
##############################################################
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crashloop-test
  namespace: test-apps
  labels:
    app: crashloop-test
    test-scenario: crashloop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: crashloop-test
  template:
    metadata:
      labels:
        app: crashloop-test
    spec:
      containers:
        - name: crash
          image: busybox:1.36
          command: ["sh", "-c", "echo 'Starting...'; sleep 2; echo 'FATAL: database connection refused'; exit 1"]
          resources:
            limits:
              memory: "64Mi"
              cpu: "50m"
