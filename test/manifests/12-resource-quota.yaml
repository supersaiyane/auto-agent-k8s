##############################################################
# TEST: Resource Quota Exhaustion
# EXPECTED: Agent detects quota >90% usage, alerts before
#           new pods fail to schedule
##############################################################

# Create a tight quota
apiVersion: v1
kind: ResourceQuota
metadata:
  name: tight-quota
  namespace: test-apps
  labels:
    test-scenario: quota
spec:
  hard:
    pods: "5"
    requests.cpu: "200m"
    requests.memory: "256Mi"
    limits.cpu: "500m"
    limits.memory: "512Mi"
---
# Deploy pods that consume most of the quota
apiVersion: apps/v1
kind: Deployment
metadata:
  name: quota-consumer
  namespace: test-apps
  labels:
    app: quota-consumer
    test-scenario: quota
spec:
  replicas: 4
  selector:
    matchLabels:
      app: quota-consumer
  template:
    metadata:
      labels:
        app: quota-consumer
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sleep", "infinity"]
          resources:
            requests:
              memory: "48Mi"
              cpu: "40m"
            limits:
              memory: "96Mi"
              cpu: "100m"
