kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: auto-agent-test
nodes:
  - role: control-plane
    extraPortMappings:
      # Agent dashboard
      - containerPort: 30080
        hostPort: 8080
        protocol: TCP
      # Prometheus (optional)
      - containerPort: 30090
        hostPort: 9090
        protocol: TCP
  - role: worker
    labels:
      node-role.kubernetes.io/worker: ""
  - role: worker
    labels:
      node-role.kubernetes.io/worker: ""
