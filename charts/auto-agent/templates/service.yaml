apiVersion: v1
kind: Service
metadata:
  name: auto-agent
  namespace: {{ .Values.namespace }}
spec:
  # Controllers only: they serve the dashboard, the API and event ingest
  # (ADR-001). Node agents serve probes and metrics on their own pods.
  selector:
    app: auto-agent-controller
  ports:
  - name: http
    port: 8080
    targetPort: 8080
