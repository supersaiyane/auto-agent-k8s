apiVersion: v1
kind: ConfigMap
metadata:
  name: auto-agent-config
  namespace: {{ include "auto-agent.namespace" . }}
data:
  AUTO_MODE: "{{ .Values.agent.mode }}"
  HPA_COEXISTENCE: "{{ .Values.agent.hpaCoexistence }}"
  SCALE_CPU_THRESHOLD: "{{ .Values.agent.cpuThreshold }}"
  SCALE_WINDOW: "{{ .Values.agent.scaleWindow }}"
  MAX_SCALE_STEP: "{{ .Values.agent.maxScaleStep }}"
  MAX_ACTIONS_PER_10M: "{{ .Values.agent.maxActionsPer10m }}"
  TLS_CERT_CHECK: "{{ .Values.rbac.readTLSSecrets }}"
  LEADER_LEASE_NAMESPACE: "{{ include "auto-agent.leaseNamespace" . }}"
  CIRCUIT_BREAKER_THRESHOLD: "{{ .Values.guardrails.circuitBreakerThreshold }}"
  BLAST_RADIUS_MAX_NAMESPACES: "{{ .Values.guardrails.blastRadiusMaxNamespaces }}"
  WATCH_NAMESPACES: "{{ join "," .Values.agent.watchNamespaces }}"
  FIX_NAMESPACES: "{{ join "," .Values.agent.fixNamespaces }}"
  FIX_CEILING: "{{ include "auto-agent.fixCeiling" . }}"
  FIX_ANYWHERE: "{{ .Values.rbac.fixAnywhere }}"
  EXCLUDED_ANNOTATION: "{{ .Values.agent.excludedAnnotation }}"
  LOG_LEVEL: "{{ .Values.agent.logLevel }}"
  COOLDOWN_UP: "{{ .Values.agent.cooldownUp }}"
  COOLDOWN_DOWN: "{{ .Values.agent.cooldownDown }}"
  MAX_REPLICAS: "{{ .Values.agent.maxReplicas }}"
  MIN_REPLICAS: "{{ .Values.agent.minReplicas }}"
  DEDUP_TTL_SECONDS: "{{ .Values.agent.dedupTtlSeconds }}"
  LLM_TIMEOUT_SEC: "{{ .Values.agent.llmTimeoutSec }}"
  SLACK_TIMEOUT_SEC: "{{ .Values.agent.slackTimeoutSec }}"
  KUBE_API_QPS: "{{ .Values.agent.apiQps }}"
  KUBE_API_BURST: "{{ .Values.agent.apiBurst }}"
  METRICS_PROVIDER: "{{ .Values.metricsProvider.type }}"
  PROMETHEUS_URL: "{{ .Values.metricsProvider.prometheusUrl }}"
  LLM_ENABLED: "{{ .Values.llm.enabled }}"
  LLM_API_URL: "{{ .Values.llm.apiUrl }}"
  LLM_MODEL: "{{ .Values.llm.model }}"
  GITOPS_MODE: "{{ .Values.gitops.mode }}"
  GITOPS_PROVIDER: "{{ .Values.gitops.provider }}"
  GITOPS_REPO: "{{ .Values.gitops.repo }}"
  GITOPS_BRANCH: "{{ .Values.gitops.branch }}"
  GITOPS_VALUES_FILE: "{{ .Values.gitops.valuesFile }}"
  GITOPS_AUTHOR_NAME: "{{ .Values.gitops.author.name }}"
  GITOPS_AUTHOR_EMAIL: "{{ .Values.gitops.author.email }}"
  TICKETS_ENABLED: "{{ .Values.tickets.enabled }}"
  TICKETS_PROVIDER: "{{ .Values.tickets.provider }}"
  GITHUB_REPO: "{{ .Values.tickets.github.repo }}"
  JIRA_BASE_URL: "{{ .Values.tickets.jira.baseUrl }}"
  JIRA_PROJECT_KEY: "{{ .Values.tickets.jira.projectKey }}"
  ANOMALIES_POLL_INTERVAL: "{{ .Values.anomalies.pollInterval }}"
  LOG_STORE: "{{ .Values.logs.store }}"
  LOG_S3_BUCKET: "{{ .Values.logs.s3.bucket }}"
  LOG_S3_PREFIX: "{{ .Values.logs.s3.prefix }}"
  # Container path, not logs.efs.path: only /var/log/auto-agent is mounted
  # and writable (read-only root); the host side is set in daemonset.yaml (ISS-031).
  LOG_EFS_PATH: "/var/log/auto-agent"
  QUIET_HOURS: "{{ .Values.guardrails.quietHours }}"
  PROM_QUEUE_DEPTH: "{{ .Values.scalingGates.queueDepthQuery }}"
  PROM_ERROR_RATE: "{{ .Values.scalingGates.errorRateQuery }}"
  PROM_P95_LATENCY: "{{ .Values.scalingGates.p95LatencyQuery }}"
  ALERTMANAGER_URL: "{{ .Values.alertmanager.url }}"
  SCALE_INTERVAL: "{{ .Values.loops.scaleInterval }}"
  JOB_INTERVAL: "{{ .Values.loops.jobInterval }}"
  QUOTA_INTERVAL: "{{ .Values.loops.quotaInterval }}"
  HEALTH_INTERVAL: "{{ .Values.loops.healthInterval }}"
  COST_CPU_PER_HOUR: "{{ .Values.cost.cpuPerHour }}"
  COST_MEM_PER_GIB_HOUR: "{{ .Values.cost.memPerGiBHour }}"
  COST_CURRENCY: "{{ .Values.cost.currency }}"
  COST_INSTANCE_PRICES: "{{ .Values.cost.instancePrices }}"
  KUBECOST_URL: "{{ .Values.cost.kubecostUrl }}"
  OPENCOST_URL: "{{ .Values.cost.opencostUrl }}"
  LOG_FORMAT: "{{ .Values.logging.format }}"
  LOG_RETENTION_DAYS: "{{ .Values.logs.retentionDays }}"
  LEARNING_ENABLED: "{{ .Values.learning.enabled }}"
  LEARNING_PERIOD_DAYS: "{{ .Values.learning.periodDays }}"
  WEBHOOK_REQUIRE_LIMITS: "{{ .Values.webhook.requireLimits }}"
  WEBHOOK_REQUIRE_READINESS: "{{ .Values.webhook.requireReadiness }}"
  WEBHOOK_BLOCKED_IMAGES: "{{ join "," .Values.webhook.blockedImages }}"
  SMTP_HOST: "{{ .Values.escalation.smtpHost }}"
  SMTP_PORT: "{{ .Values.escalation.smtpPort }}"
  SMTP_USER: "{{ .Values.escalation.smtpUser }}"
  SMTP_FROM: "{{ .Values.escalation.smtpFrom }}"
  ESCALATION_EMAIL_TO: "{{ .Values.escalation.emailTo }}"
  IMAGE_MIRROR_ENABLED: "{{ .Values.images.mirror.enabled }}"
  IMAGE_MIRROR_PREFIX: "{{ .Values.images.mirror.prefix }}"
  IMAGE_MIRROR_ALLOWLIST: "{{ join "," .Values.images.mirror.allowList }}"
