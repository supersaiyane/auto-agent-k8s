{{- if and .Values.images.mirror.enabled (not .Values.webhook.enabled) }}
{{- fail "images.mirror.enabled needs webhook.enabled: the admission webhook does the rewrite" }}
{{- end }}
{{- if .Values.webhook.enabled }}
{{- $ns := include "auto-agent.namespace" . }}
{{- $useCM := and .Values.webhook.tls.certManager (not .Values.webhook.tls.secretName) }}
{{- if and (not $useCM) (not .Values.webhook.tls.secretName) }}
{{- fail "webhook.enabled needs a serving certificate: keep webhook.tls.certManager true (cert-manager installed) or set webhook.tls.secretName and webhook.caBundle" }}
{{- end }}
{{- if $useCM }}
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: auto-agent-webhook
  namespace: {{ $ns }}
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: auto-agent-webhook
  namespace: {{ $ns }}
spec:
  secretName: {{ include "auto-agent.webhookSecret" . }}
  dnsNames:
    - auto-agent-webhook.{{ $ns }}.svc
    - auto-agent-webhook.{{ $ns }}.svc.cluster.local
  issuerRef:
    name: auto-agent-webhook
    kind: Issuer
---
{{- end }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: auto-agent-webhook
  labels:
    {{- include "auto-agent.labels" . | nindent 4 }}
  {{- if $useCM }}
  annotations:
    cert-manager.io/inject-ca-from: {{ $ns }}/auto-agent-webhook
  {{- end }}
webhooks:
  - name: validate.autoagent.io
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: {{ .Values.webhook.failurePolicy | default "Ignore" }}
    matchPolicy: Equivalent
    rules:
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["deployments", "statefulsets"]
    clientConfig:
      service:
        name: auto-agent-webhook
        namespace: {{ include "auto-agent.namespace" . }}
        path: /validate
        port: 8443
      {{- if and (not $useCM) .Values.webhook.caBundle }}
      caBundle: {{ .Values.webhook.caBundle }}
      {{- end }}
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: ["kube-system", "kube-public", "kube-node-lease"]
{{- if .Values.images.mirror.enabled }}
{{- if not .Values.images.mirror.allowList }}
{{- fail "images.mirror.enabled needs images.mirror.allowList: the mirror only rewrites allowlisted images" }}
{{- end }}
---
# images.mirror (ISS-012): rewrites allowlisted image references to the
# mirror as pods are created. failurePolicy Ignore: the mirror never blocks
# a pod. The agent's own namespace and the system ones are left alone.
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: auto-agent-mirror
  labels:
    {{- include "auto-agent.labels" . | nindent 4 }}
  {{- if $useCM }}
  annotations:
    cert-manager.io/inject-ca-from: {{ $ns }}/auto-agent-webhook
  {{- end }}
webhooks:
  - name: mirror.autoagent.io
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Ignore
    reinvocationPolicy: Never
    rules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
    clientConfig:
      service:
        name: auto-agent-webhook
        namespace: {{ $ns }}
        path: /mutate
        port: 8443
      {{- if and (not $useCM) .Values.webhook.caBundle }}
      caBundle: {{ .Values.webhook.caBundle }}
      {{- end }}
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: ["kube-system", "kube-public", "kube-node-lease", {{ $ns | quote }}]
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: auto-agent-webhook
  namespace: {{ include "auto-agent.namespace" . }}
spec:
  selector:
    app: auto-agent-controller
  ports:
    - port: 8443
      targetPort: 8443
      protocol: TCP
{{- end }}
