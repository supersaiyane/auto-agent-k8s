# One ServiceAccount per role (ADR-001): each gets only what its code uses.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: auto-agent
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "auto-agent.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: auto-agent-node
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "auto-agent.labels" . | nindent 4 }}
    app.kubernetes.io/component: node
