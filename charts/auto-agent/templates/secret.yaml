apiVersion: v1
kind: Secret
metadata:
  name: auto-agent-secrets
  namespace: {{ include "auto-agent.namespace" . }}
type: Opaque
stringData:
  SLACK_WEBHOOK_URL: "{{ .Values.slack.webhookUrl }}"
  SLACK_SIGNING_SECRET: "{{ .Values.slack.signingSecret }}"
  DASHBOARD_TOKEN: "{{ .Values.dashboard.token }}"
  {{- /* Node agents authenticate to the controller with this (ADR-001).
  Generated once; an upgrade keeps the value already in the cluster. */}}
  {{- $existing := lookup "v1" "Secret" (include "auto-agent.namespace" .) "auto-agent-secrets" }}
  {{- $internal := .Values.internalToken }}
  {{- if and (not $internal) $existing $existing.data (hasKey $existing.data "INTERNAL_TOKEN") }}
  {{- $internal = index $existing.data "INTERNAL_TOKEN" | b64dec }}
  {{- end }}
  INTERNAL_TOKEN: {{ default (randAlphaNum 48) $internal | quote }}
  LLM_API_KEY: ""
  GIT_TOKEN: ""
  GITHUB_TOKEN: ""
  JIRA_TOKEN: ""
  JIRA_EMAIL: ""
  PAGERDUTY_ROUTING_KEY: "{{ .Values.escalation.pagerdutyRoutingKey }}"
  OPSGENIE_API_KEY: "{{ .Values.escalation.opsgenieApiKey }}"
  SMTP_PASS: "{{ .Values.escalation.smtpPass }}"
