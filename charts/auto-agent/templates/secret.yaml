apiVersion: v1
kind: Secret
metadata:
  name: auto-agent-secrets
  namespace: {{ .Values.namespace }}
type: Opaque
stringData:
  SLACK_WEBHOOK_URL: "{{ .Values.slack.webhookUrl }}"
  SLACK_SIGNING_SECRET: "{{ .Values.slack.signingSecret }}"
  DASHBOARD_TOKEN: "{{ .Values.dashboard.token }}"
  LLM_API_KEY: ""
  GIT_TOKEN: ""
  GITHUB_TOKEN: ""
  JIRA_TOKEN: ""
  JIRA_EMAIL: ""
  PAGERDUTY_ROUTING_KEY: "{{ .Values.escalation.pagerdutyRoutingKey }}"
  OPSGENIE_API_KEY: "{{ .Values.escalation.opsgenieApiKey }}"
  SMTP_PASS: "{{ .Values.escalation.smtpPass }}"
