# The controller (ADR-001): leader-elected cluster loops, the one event log,
# the dashboard, the API, Slack callbacks and the admission webhook. Node
# agents (daemonset.yaml) forward their events here. The standby replica
# proxies API and ingest requests to the leader.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auto-agent-controller
  namespace: {{ include "auto-agent.namespace" . }}
  labels:
    {{- include "auto-agent.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
spec:
  replicas: {{ .Values.controller.replicas }}
  selector:
    matchLabels:
      app: auto-agent-controller
  template:
    metadata:
      labels:
        app: auto-agent-controller
        {{- include "auto-agent.labels" . | nindent 8 }}
        app.kubernetes.io/component: controller
    spec:
      serviceAccountName: auto-agent
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      {{- with .Values.controller.tolerations }}
      tolerations: {{- toYaml . | nindent 6 }}
      {{- end }}
      affinity:
        # Two replicas on two nodes, so one node failing leaves a controller.
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app: auto-agent-controller
      volumes:
      # Event log and audit log. Each controller keeps its own (ISS-059).
      - name: state
        emptyDir: {}
      containers:
      - name: agent
        image: "{{ include "auto-agent.image" . }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        envFrom:
          - configMapRef: { name: auto-agent-config }
          - secretRef:    { name: auto-agent-secrets }
        env:
        - name: AGENT_ROLE
          value: controller
        - name: POD_NAME
          valueFrom: { fieldRef: { fieldPath: metadata.name } }
        - name: POD_NAMESPACE
          valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
        - name: NODE_NAME
          valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
        {{- if .Values.env }}
        {{- toYaml .Values.env | nindent 8 }}
        {{- end }}
        volumeMounts:
        - name: state
          mountPath: /var/log/auto-agent
        ports:
        - name: http
          containerPort: 8080
        {{- if .Values.webhook.enabled }}
        - name: webhook
          containerPort: 8443
        {{- end }}
        livenessProbe:
          httpGet: { path: /healthz, port: 8080 }
          initialDelaySeconds: 10
          periodSeconds: 15
          failureThreshold: 3
        readinessProbe:
          httpGet: { path: /readyz, port: 8080 }
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 3
        resources:
          {{- toYaml .Values.controller.resources | nindent 10 }}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: { drop: ["ALL"] }
