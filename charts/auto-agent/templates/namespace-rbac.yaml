{{- if .Values.namespacedRBAC.enabled }}
{{- range .Values.agent.namespaceAllowlist }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: auto-agent
  namespace: {{ . }}
rules:
- apiGroups: [""]
  resources: ["pods", "pods/log", "pods/status", "events", "configmaps", "resourcequotas", "persistentvolumeclaims", "endpoints"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["delete"]
- apiGroups: [""]
  resources: ["pods/eviction"]
  verbs: ["create"]
- apiGroups: ["apps"]
  resources: ["deployments", "replicasets", "statefulsets"]
  verbs: ["get", "list", "watch", "patch", "update"]
- apiGroups: ["batch"]
  resources: ["jobs", "cronjobs"]
  verbs: ["get", "list", "watch", "delete"]
- apiGroups: ["autoscaling"]
  resources: ["horizontalpodautoscalers"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["policy"]
  resources: ["poddisruptionbudgets"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["autoagent.io"]
  resources: ["autoremediationpolicies", "autoremediationpolicies/status"]
  verbs: ["get", "list", "watch", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: auto-agent
  namespace: {{ . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: auto-agent
subjects:
- kind: ServiceAccount
  name: auto-agent
  namespace: {{ $.Values.namespace }}
{{- end }}

# Minimal ClusterRole for cross-namespace operations (nodes, namespaces, leases)
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: auto-agent-global
rules:
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get", "list", "watch", "update", "patch"]
- apiGroups: [""]
  resources: ["namespaces"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["coordination.k8s.io"]
  resources: ["leases"]
  verbs: ["get", "list", "watch", "create", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: auto-agent-global
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: auto-agent-global
subjects:
- kind: ServiceAccount
  name: auto-agent
  namespace: {{ .Values.namespace }}
{{- end }}
