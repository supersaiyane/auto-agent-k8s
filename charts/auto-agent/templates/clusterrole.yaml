# Cluster-wide reads, one ClusterRole per role (ADR-001). Every grant here is
# used by the code that role runs; TestRBAC_EachRoleMatchesItsCode in
# internal/kube fails on any drift (ISS-009). Workload writes live in
# roles.yaml, one Role per allowlisted namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: auto-agent
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]
- apiGroups: [""]
  resources: ["pods/log"]
  verbs: ["get"]
- apiGroups: [""]
  resources: ["endpoints"]
  verbs: ["get", "list"]
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get", "list"]   # get: the kubectl panel's describe node
- apiGroups: [""]
  resources: ["events", "namespaces", "limitranges", "persistentvolumeclaims", "resourcequotas", "services"]
  verbs: ["list"]
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "list"]
- apiGroups: ["apps"]
  resources: ["replicasets", "statefulsets", "daemonsets"]
  verbs: ["list"]
- apiGroups: ["batch"]
  resources: ["jobs", "cronjobs"]
  verbs: ["list"]
- apiGroups: ["autoscaling"]
  resources: ["horizontalpodautoscalers"]
  verbs: ["list"]
- apiGroups: ["networking.k8s.io"]
  resources: ["ingresses"]
  verbs: ["list"]
- apiGroups: ["policy"]
  resources: ["poddisruptionbudgets"]
  verbs: ["list"]
- apiGroups: ["storage.k8s.io"]
  resources: ["storageclasses"]
  verbs: ["get"]
- apiGroups: ["autoagent.io"]
  resources: ["autoremediationpolicies"]
  verbs: ["get", "list", "watch"]
---
# Node agents: the pods and Node object of their own node (the informers
# filter by node; RBAC cannot), patch to cordon their own node.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: auto-agent-node
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["list", "watch"]
- apiGroups: [""]
  resources: ["pods/log"]
  verbs: ["get"]
- apiGroups: [""]
  resources: ["events"]
  verbs: ["list"]
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["list", "watch", "patch"]
- apiGroups: ["autoagent.io"]
  resources: ["autoremediationpolicies"]
  verbs: ["get", "list", "watch"]
