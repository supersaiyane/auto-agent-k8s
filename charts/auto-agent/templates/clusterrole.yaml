# Cluster-wide reads, one ClusterRole per role (ADR-001). Every grant here is
# used by the code that role runs; TestRBAC_EachRoleMatchesItsCode in
# internal/kube fails on any drift (ISS-009). Workload writes live in
# roles.yaml, one Role per allowlisted namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: auto-agent
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]
- apiGroups: [""]
  resources: ["pods/log"]
  verbs: ["get"]
- apiGroups: ["discovery.k8s.io"]
  resources: ["endpointslices"]
  verbs: ["list"]   # CheckServiceEndpoints (ISS-034, ISS-035)
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get", "list"]   # get: the kubectl panel's describe node
- apiGroups: [""]
  resources: ["events", "namespaces", "limitranges", "persistentvolumeclaims", "resourcequotas", "services"]
  verbs: ["list"]
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "list"]
- apiGroups: ["apps"]
  resources: ["replicasets", "controllerrevisions"]
  verbs: ["list"]   # controllerrevisions: the terminal's rollout history sts/<name>
# The terminal's describe (PLAN-003): one object at a time, read-only.
- apiGroups: [""]
  resources: ["services", "persistentvolumeclaims"]
  verbs: ["get"]
- apiGroups: ["batch"]
  resources: ["jobs"]
  verbs: ["get"]
- apiGroups: ["autoscaling"]
  resources: ["horizontalpodautoscalers"]
  verbs: ["get"]
- apiGroups: ["networking.k8s.io"]
  resources: ["ingresses"]
  verbs: ["get"]
- apiGroups: ["networking.k8s.io"]
  resources: ["networkpolicies"]
  verbs: ["list"]
# The terminal's auth can-i asks what the agent itself may do; nothing is stored.
- apiGroups: ["authorization.k8s.io"]
  resources: ["selfsubjectaccessreviews"]
  verbs: ["create"]
- apiGroups: ["apps"]
  resources: ["statefulsets", "daemonsets"]
  verbs: ["get", "list"]   # get: config reload checks the rollout
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["list", "watch"]   # config reload, in the watch scope (system namespaces excluded by field selector)
- apiGroups: ["batch"]
  resources: ["jobs", "cronjobs"]
  verbs: ["list"]
- apiGroups: ["autoscaling"]
  resources: ["horizontalpodautoscalers"]
  verbs: ["list"]
- apiGroups: ["networking.k8s.io"]
  resources: ["ingresses"]
  verbs: ["list"]
- apiGroups: ["policy"]
  resources: ["poddisruptionbudgets"]
  verbs: ["list"]
- apiGroups: ["storage.k8s.io"]
  resources: ["storageclasses"]
  verbs: ["get", "list"]   # get: volume expansion check (promchecks); list: CheckStorageIssues
- apiGroups: ["autoagent.io"]
  resources: ["autoremediationpolicies"]
  verbs: ["get", "list", "watch"]
---
# Node agents: the pods and Node object of their own node (the informers
# filter by node; RBAC cannot), patch to cordon their own node.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: auto-agent-node
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["list", "watch"]
- apiGroups: [""]
  resources: ["pods/log"]
  verbs: ["get"]
- apiGroups: [""]
  resources: ["events"]
  verbs: ["list"]
# Network probes from each node (PLAN-002 phase 14): the watched namespaces,
# and the Services with ready endpoints to dial.
- apiGroups: [""]
  resources: ["namespaces", "services"]
  verbs: ["list"]
- apiGroups: ["discovery.k8s.io"]
  resources: ["endpointslices"]
  verbs: ["list"]
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["list", "watch", "patch"]
- apiGroups: ["autoagent.io"]
  resources: ["autoremediationpolicies"]
  verbs: ["get", "list", "watch"]
