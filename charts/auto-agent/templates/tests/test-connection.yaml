apiVersion: v1
kind: Pod
metadata:
  name: auto-agent-test
  namespace: {{ include "auto-agent.namespace" . }}
  labels:
    {{- include "auto-agent.labels" . | nindent 4 }}
    app.kubernetes.io/component: helm-test   # admitted by the controller NetworkPolicy
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 100           # curl_user in the curlimages image
    seccompProfile: { type: RuntimeDefault }
  containers:
  - name: test-healthz
    image: {{ .Values.testImage | quote }}
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities: { drop: [ALL] }
    command: ['sh', '-c']
    args:
      - |
        echo "Testing /healthz..."
        curl -sf http://auto-agent.{{ include "auto-agent.namespace" . }}.svc.cluster.local:8080/healthz || exit 1
        echo " OK"

        echo "Testing /readyz..."
        curl -sf http://auto-agent.{{ include "auto-agent.namespace" . }}.svc.cluster.local:8080/readyz || exit 1
        echo " OK"

        # /api/ needs the dashboard token (ISS-005), so it is not probed here.

        echo "Testing /metrics..."
        METRICS=$(curl -sf http://auto-agent.{{ include "auto-agent.namespace" . }}.svc.cluster.local:8080/metrics)
        echo "$METRICS" | grep -q 'auto_agent_info' || exit 1
        echo " OK"

        echo "Testing dashboard UI..."
        curl -sf http://auto-agent.{{ include "auto-agent.namespace" . }}.svc.cluster.local:8080/ | grep -q 'auto-agent' || exit 1
        echo " OK"

        echo "All tests passed."
