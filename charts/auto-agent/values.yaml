image:
  repository: ghcr.io/supersaiyane/auto-agent-k8s
  tag: "1.0.0"
  # Pin the image by digest in production (CLAUDE.md constraint 11): when set,
  # the pods use repository@digest and tag is ignored.
  digest: ""
  pullPolicy: IfNotPresent

# The agent's namespace. Empty means the release namespace, so install with
# helm -n auto-agent --create-namespace. Watched namespaces never include it.
namespace: ""
# Kept on purpose (reviewed 2026-10-07, ISS-010): node actions are taken only
# by the agent on that node (ISS-004), so it must run on every node and must
# not be evicted by the node pressure it is handling.
priorityClassName: system-node-critical
# Init container that chowns the hostPath log directory. Pinned by digest.
initImage: busybox:1.36@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
# Image of the `helm test` pod, pinned by digest (constraint 11, ISS-065).
testImage: curlimages/curl:8.5.0@sha256:08e466006f0860e54fc299378de998935333e0e130a15f6f98482e9f8dab3058

agent:
  mode: dry-run                    # observe|suggest|dry-run|fix (fix is an explicit opt-in)
  hpaCoexistence: true             # skip scaling if HPA present
  cpuThreshold: 0.8                # avg CPU threshold for scale-up
  scaleWindow: 5m
  maxScaleStep: 2
  maxActionsPer10m: 10
  # Namespace scopes (ADR-002). watchNamespaces: where the agent reads,
  # detects and reports, and what the dashboard shows. Empty means every
  # namespace except kube-system, kube-public, kube-node-lease and its own.
  watchNamespaces: []
  # fixNamespaces: where the agent may act at install. The dashboard Settings
  # tab changes this later, always inside fixCeiling. Empty means nowhere.
  fixNamespaces: []
  # fixCeiling: where write Roles are rendered, so the most the Settings tab
  # can ever enable. Empty means the same as fixNamespaces. Each namespace
  # must exist before install. Ignored when rbac.fixAnywhere is true.
  fixCeiling: []
  excludedAnnotation: "auto-agent.io/disable"
  logLevel: info
  cooldownUp: 2m                   # minimum time between scale-ups
  cooldownDown: 10m                # long cooldown for scale-down
  maxReplicas: 50                  # global max replicas cap
  minReplicas: 1                   # global min replicas floor
  dedupTtlSeconds: 300             # deduplication TTL (5 min)
  llmTimeoutSec: 10
  slackTimeoutSec: 5
  apiQps: 50                       # Kubernetes API requests per second, per pod
  apiBurst: 100                    # short bursts above apiQps, per pod

llm:
  apiUrl: "https://llm-gateway.internal/v1/chat/completions"
  model: "gpt-4o-mini"
  enabled: false                   # disabled by default for safety

slack:
  webhookUrl: ""                   # put in secret or here for POC
  signingSecret: ""                # Slack app signing secret; buttons are rejected without it
  # Webhooks for the channels AutoRemediationPolicy escalation.slackChannel
  # names, e.g. {"#payments-oncall": "https://hooks.slack.com/..."}. A
  # channel not listed here falls back to webhookUrl.
  channelWebhooks: {}

metricsProvider:
  type: "prometheus"               # "metrics-server" or "prometheus"
  prometheusUrl: "http://prometheus-server.monitoring.svc.cluster.local:9090"

gitops:
  # WARNING: not implemented yet (ISS-012, PLAN-002 phase 17); the agent always
  # opens a pull request. "live" will commit straight to the branch, skipping
  # code review, and will stay off unless you set it.
  mode: pr                         # pr | live (not implemented)
  provider: github                 # github|gitlab
  repo: "yourorg/helm-env"
  branch: "main"
  valuesFile: "environments/prod/values.yaml"
  author:
    name: "auto-agent-bot"
    email: "auto-agent@yourorg.io"

tickets:
  enabled: false                   # disabled by default
  provider: github                 # github|jira
  github:
    repo: yourorg/api-service
  jira:
    baseUrl: ""
    projectKey: ""

anomalies:
  pollInterval: 30s

logs:
  store: efs                       # s3|efs|none
  s3:
    bucket: your-bucket-name
    prefix: auto-agent/logs
  efs:
    path: /var/log/auto-agent
  retentionDays: 7

rbac:
  # Lets the certificate expiry check list TLS secrets in allowlisted
  # namespaces. Off by default: reading secrets is a large grant.
  readTLSSecrets: false
  # One write ClusterRole instead of a Role per fixCeiling namespace, so the
  # Settings tab can enable fixing in any non-system namespace. WARNING: a
  # leaked dashboard or agent token can then disrupt any namespace. The agent
  # logs a warning at every start and the dashboard shows the mode.
  fixAnywhere: false

# Config reload (PLAN-002 Part A): restart the workloads that use a changed
# ConfigMap key, one at a time, through the gate. It follows the mode, so
# with the default dry-run it only records what it would restart.
reload:
  enabled: true
  # Also reload on Secret changes. Off by default: it adds Secret list and
  # watch inside the fix ceiling. Only key names and hashes are kept; values
  # are never logged. See GUIDE section "Reloading on Secret changes".
  secrets: false
  reloadOn: auto                   # auto: skip plain volume mounts (updated in place); always: restart anyway
  debounce: 10s                    # edits within this window give one reload

# Network probes every node agent runs from its own pod network (PLAN-002
# phase 14). They only resolve names and open TCP connections; they change
# nothing.
probes:
  interval: 1m
  dns: true                        # resolve kubernetes.default.svc.<clusterDomain>
  clusterDomain: cluster.local
  dnsExternalName: ""              # also resolve this name to test upstream DNS; empty: off
  services: false                  # dial a sample of Services that have ready endpoints (opt-in)
  egressTarget: ""                 # host:port to dial to test egress (opt-in); empty: off

# Approve to fix, rung R3 (PLAN-002 phase 15). Some findings carry an exact
# change (raise an HPA's maxReplicas, raise a CPU limit, expand a claim,
# resume a Deployment, delete stuck DaemonSet pods, run a missed CronJob).
# In fix mode, inside the fix scope, the change waits for one of these
# Slack users to press Approve; it then goes through the same gate as every
# other fix. No groups: approvals are off and these stay suggestions. Needs
# slack.signingSecret so the callback can be verified.
approvals:
  ttl: 30m                         # a queued change expires after this
  groups: []                       # who may approve, e.g. ["slack:U123ABC"]

leaderElection:
  namespace: ""                    # where the auto-agent-leader Lease lives; empty: the agent's namespace

guardrails:
  circuitBreakerThreshold: 5       # actions per workload per hour before the breaker trips
  blastRadiusMaxNamespaces: 5      # distinct namespaces acted on per hour
  quietHours: ""                   # UTC windows with no actions, e.g. "02:00-06:00,22:00-23:00"

# Optional PromQL "gates" for scale-up. If any is set, scale-up needs CPU over
# the threshold AND a gate query returning > 0. Empty: CPU alone decides.
scalingGates:
  queueDepthQuery: ""
  errorRateQuery: ""
  p95LatencyQuery: ""

alertmanager:
  url: ""                          # e.g. http://alertmanager.monitoring:9093

# How often the leader loops run.
loops:
  scaleInterval: 30s               # scaling, anomalies, fix verification
  jobInterval: 2m                  # workload, job, rollout and node checks
  quotaInterval: 5m                # quota, storage, network and security checks
  healthInterval: 3m               # self check

# Cost tab. Empty means the built-in defaults (0.05 per core-hour, 0.005 per
# GiB-hour, source "default"); setting cpuPerHour marks the source "manual".
cost:
  cpuPerHour: ""
  memPerGiBHour: ""
  currency: ""                     # default USD
  instancePrices: ""               # e.g. "t3.medium=0.0416,m5.xlarge=0.192"
  kubecostUrl: ""                  # use Kubecost as the source
  opencostUrl: ""                  # use OpenCost as the source (if no Kubecost)

logging:
  format: text                     # text | json

dashboard:
  # Bearer token for /api/ (dashboard and kubectl endpoint). Empty disables
  # the API (503). Generate one with: openssl rand -hex 32
  token: ""

networkPolicy:
  enabled: true
  # Namespaces allowed to reach the agent on 8080 (dashboard, /metrics, Slack
  # callback). Add your Prometheus and ingress controller namespaces here.
  allowFromNamespaces: ["monitoring"]

webhook:
  enabled: false                   # enable admission webhook
  failurePolicy: Ignore            # Ignore or Fail
  caBundle: ""                     # base64 CA bundle for TLS
  requireLimits: true
  requireReadiness: true
  blockedImages: []

escalation:
  pagerdutyRoutingKey: ""
  opsgenieApiKey: ""
  smtpHost: ""
  smtpPort: "587"
  smtpUser: ""
  smtpPass: ""                     # stored in the Secret
  smtpFrom: ""
  emailTo: ""

learning:
  enabled: false
  periodDays: 14

images:
  # WARNING: not implemented yet (ISS-012, PLAN-002 phase 17). When built, the
  # admission webhook will rewrite matching image references as pods are
  # created. Off by default.
  mirror:
    enabled: false
    prefix: "registry.internal/"
    allowList: []

# Controller (ADR-001): leader-elected cluster loops, event log, dashboard
# and API. Node agents run as the DaemonSet and use tolerations/resources.
controller:
  replicas: 2
  tolerations: []
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

# Token node agents use to reach the controller. Empty: generated once and
# kept across upgrades.
internalToken: ""

env: []
tolerations:
  - operator: "Exists"
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 300m
    memory: 384Mi
