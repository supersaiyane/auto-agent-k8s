image:
  repository: ghcr.io/supersaiyane/auto-agent-k8s
  tag: "1.0.0"
  pullPolicy: IfNotPresent

namespace: kube-system
# Kept on purpose (reviewed 2026-10-07, ISS-010): node actions are taken only
# by the agent on that node (ISS-004), so it must run on every node and must
# not be evicted by the node pressure it is handling.
priorityClassName: system-node-critical
# Init container that chowns the hostPath log directory. Pinned by digest.
initImage: busybox:1.36@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662

agent:
  mode: dry-run                    # observe|suggest|dry-run|fix (fix is an explicit opt-in)
  hpaCoexistence: true             # skip scaling if HPA present
  cpuThreshold: 0.8                # avg CPU threshold for scale-up
  scaleWindow: 5m
  maxScaleStep: 2
  maxActionsPer10m: 10
  # Namespaces the agent reads and may act in. Each gets a write Role, so each
  # must exist before install. Add production namespaces explicitly.
  namespaceAllowlist: ["default"]
  excludedAnnotation: "auto-agent.io/disable"
  logLevel: info
  cooldownUp: 2m                   # minimum time between scale-ups
  cooldownDown: 10m                # long cooldown for scale-down
  maxReplicas: 50                  # global max replicas cap
  minReplicas: 1                   # global min replicas floor
  dedupTtlSeconds: 300             # deduplication TTL (5 min)
  llmTimeoutSec: 10
  slackTimeoutSec: 5

llm:
  apiUrl: "https://llm-gateway.internal/v1/chat/completions"
  model: "gpt-4o-mini"
  enabled: false                   # disabled by default for safety

slack:
  webhookUrl: ""                   # put in secret or here for POC
  signingSecret: ""                # Slack app signing secret; buttons are rejected without it

metricsProvider:
  type: "prometheus"               # "metrics-server" or "prometheus"
  prometheusUrl: "http://prometheus-server.monitoring.svc.cluster.local:9090"

gitops:
  # WARNING: not implemented yet (ISS-012, PLAN-002 phase 17); the agent always
  # opens a pull request. "live" will commit straight to the branch, skipping
  # code review, and will stay off unless you set it.
  mode: pr                         # pr | live (not implemented)
  provider: github                 # github|gitlab
  repo: "yourorg/helm-env"
  branch: "main"
  valuesFile: "environments/prod/values.yaml"
  author:
    name: "auto-agent-bot"
    email: "auto-agent@yourorg.io"

tickets:
  enabled: false                   # disabled by default
  provider: github                 # github|jira
  github:
    repo: yourorg/api-service
  jira:
    baseUrl: ""
    projectKey: ""

anomalies:
  pollInterval: 30s

logs:
  store: efs                       # s3|efs|none
  s3:
    bucket: your-bucket-name
    prefix: auto-agent/logs
  efs:
    path: /var/log/auto-agent
  retentionDays: 7

rbac:
  # Lets the certificate expiry check list TLS secrets in allowlisted
  # namespaces. Off by default: reading secrets is a large grant.
  readTLSSecrets: false

leaderElection:
  namespace: kube-system           # where the auto-agent-leader Lease lives

guardrails:
  circuitBreakerThreshold: 5       # actions per workload per hour before the breaker trips
  blastRadiusMaxNamespaces: 5      # distinct namespaces acted on per hour
  quietHours: ""                   # UTC windows with no actions, e.g. "02:00-06:00,22:00-23:00"

# Optional PromQL "gates" for scale-up. If any is set, scale-up needs CPU over
# the threshold AND a gate query returning > 0. Empty: CPU alone decides.
scalingGates:
  queueDepthQuery: ""
  errorRateQuery: ""
  p95LatencyQuery: ""

alertmanager:
  url: ""                          # e.g. http://alertmanager.monitoring:9093

# How often the leader loops run.
loops:
  scaleInterval: 30s               # scaling, anomalies, fix verification
  jobInterval: 2m                  # workload, job, rollout and node checks
  quotaInterval: 5m                # quota, storage, network and security checks
  healthInterval: 3m               # self check

# Cost tab. Empty means the built-in defaults (0.05 per core-hour, 0.005 per
# GiB-hour, source "default"); setting cpuPerHour marks the source "manual".
cost:
  cpuPerHour: ""
  memPerGiBHour: ""
  currency: ""                     # default USD
  instancePrices: ""               # e.g. "t3.medium=0.0416,m5.xlarge=0.192"
  kubecostUrl: ""                  # use Kubecost as the source
  opencostUrl: ""                  # use OpenCost as the source (if no Kubecost)

logging:
  format: text                     # text | json

dashboard:
  # Bearer token for /api/ (dashboard and kubectl endpoint). Empty disables
  # the API (503). Generate one with: openssl rand -hex 32
  token: ""

networkPolicy:
  enabled: true
  # Namespaces allowed to reach the agent on 8080 (dashboard, /metrics, Slack
  # callback). Add your Prometheus and ingress controller namespaces here.
  allowFromNamespaces: ["monitoring"]

webhook:
  enabled: false                   # enable admission webhook
  failurePolicy: Ignore            # Ignore or Fail
  caBundle: ""                     # base64 CA bundle for TLS
  requireLimits: true
  requireReadiness: true
  blockedImages: []

escalation:
  pagerdutyRoutingKey: ""
  opsgenieApiKey: ""
  smtpHost: ""
  smtpPort: "587"
  smtpUser: ""
  smtpPass: ""                     # stored in the Secret
  smtpFrom: ""
  emailTo: ""

learning:
  enabled: false
  periodDays: 14

images:
  # WARNING: not implemented yet (ISS-012, PLAN-002 phase 17). When built, the
  # admission webhook will rewrite matching image references as pods are
  # created. Off by default.
  mirror:
    enabled: false
    prefix: "registry.internal/"
    allowList: []

# Controller (ADR-001): leader-elected cluster loops, event log, dashboard
# and API. Node agents run as the DaemonSet and use tolerations/resources.
controller:
  replicas: 2
  tolerations: []
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

# Token node agents use to reach the controller. Empty: generated once and
# kept across upgrades.
internalToken: ""

env: []
tolerations:
  - operator: "Exists"
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 300m
    memory: 384Mi
